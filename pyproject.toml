[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lottery-analyzer"
version = "0.2.0"
description = "Expected returns for exhaustive lottery coverage"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.12"]

[project.optional-dependencies]
web = ["Flask>=3.0"]
plot = ["matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.9", "build>=1.2"]

[tool.setuptools]
py-modules = ["lotteryAnalyzer", "app"]

[tool.setuptools.packages.find]
include = ["lottery_analyzer*"]

[tool.setuptools.package-data]
lottery_analyzer = ["templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests also import the repository-only historical data collector.
# Keep console-script and `python -m pytest` invocation behavior consistent.
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
